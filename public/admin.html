<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftBasket — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <h1 class="logo">SwiftBasket <span class="admin-tag">Admin</span></h1>
      <ul class="nav-links">
        <li><a href="index.html">Back to store</a></li>
      </ul>
    </nav>
  </header>

  <main class="admin-main">
    <div class="admin-head">
      <h2>Orders</h2>
      <div class="admin-head-actions">
        <button id="refreshBtn" class="checkout-btn refresh-btn">Refresh</button>
        <button id="logoutBtn" class="checkout-btn refresh-btn logout-btn">Log out</button>
      </div>
    </div>

    <div id="stats" class="admin-stats"></div>

    <div class="breakdown-grid">
      <div class="breakdown-card">
        <h3>By Day</h3>
        <table class="breakdown-table">
          <thead>
            <tr><th>Date</th><th>Orders</th><th>Items</th><th>Revenue</th></tr>
          </thead>
          <tbody id="dailyBody"></tbody>
        </table>
      </div>
      <div class="breakdown-card">
        <h3>By Month</h3>
        <table class="breakdown-table">
          <thead>
            <tr><th>Month</th><th>Orders</th><th>Items</th><th>Revenue</th></tr>
          </thead>
          <tbody id="monthlyBody"></tbody>
        </table>
      </div>
    </div>

    <div id="ordersWrap">
      <h3 class="section-label">All Orders</h3>
      <p id="loadingMsg" class="cart-empty">Loading orders…</p>
      <table id="ordersTable" class="orders-table" hidden>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SwiftBasket. All rights reserved.</p>
  </footer>

  <script src="js/admin.js"></script>
</body>
</html>
